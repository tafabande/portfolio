# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE UI will override any settings in this file.

# Enable AndroidX support
android.useAndroidX=true

# Suppress compileSdk 35 warning for AGP 8.5.x
android.suppressUnsupportedCompileSdk=35

# Enable non-transitive R classes for faster builds
android.nonTransitiveRClass=true

# JVM memory allocation
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Kotlin code style
kotlin.code.style=official
