name: CI/CD Pipeline & GitHub Pages Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── 1. Web Ingestion App & Portfolio Test Suite ──────────────────────────────
  build-and-test:
    name: 🛠️ Build & Test Web Ingestion App
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Ingestion App Dependencies
        working-directory: ingestion-app
        run: npm install

      - name: 🧪 Run Pipeline Test Suite
        working-directory: ingestion-app
        run: node tests/pipeline.test.js

  # ── 2. Kotlin Android App Build Pipeline ─────────────────────────────────────
  build-android:
    name: 📱 Build Kotlin Android App (APK)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📝 Configure local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > mobile/local.properties

      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔑 Make gradlew executable
        run: chmod +x mobile/gradlew

      - name: 🏗️ Build Android Debug APK
        working-directory: mobile
        run: ./gradlew assembleDebug --stacktrace

      - name: 📦 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-android-app-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ── 3. Deploy Static Portfolio to GitHub Pages ───────────────────────────────
  deploy:
    name: 🚀 Deploy Live Portfolio to GitHub Pages
    needs: [build-and-test, build-android]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🌐 Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
